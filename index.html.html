<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jannatul Prity Mim 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12040a;--bg2:#2e0b1b;--ivory:#f6e9df;--soft:#d9b9bd;--gold:#e0b377;--rose:#e0526f;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12040a;--bg2:#2e0b1b}}
:root[data-theme="dark"]{--bg:#12040a;--bg2:#2e0b1b}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ivory);font-family:var(--sans);overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(80% 55% at 50% 18%,var(--bg2),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(224,82,111,.14),transparent 70%);z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.screen{position:relative;z-index:2}
/* boot */
#boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2}
.ring .t{stroke:rgba(246,233,223,.12)}
.ring .p{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:352;stroke-dashoffset:352}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:italic 500 34px var(--serif);color:var(--ivory)}
#cap{font-size:16px;font-weight:300;color:var(--soft);min-height:1.8em;transition:opacity .4s;letter-spacing:.01em}
/* main */
#main{display:none;margin:0 auto;width:min(1000px,100%);padding:48px 20px 90px;text-align:center}
.stagewrap{perspective:900px;width:min(400px,82vw);margin:0 auto}
.frame{position:relative;aspect-ratio:3/4;border-radius:999px 999px 18px 18px;transition:transform .25s ease-out;transform-style:preserve-3d;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 90px rgba(224,82,111,.28)}
.frame::before{content:"";position:absolute;inset:-12px;border:1px solid rgba(224,179,119,.55);border-radius:999px 999px 26px 26px}
.frame::after{content:"";position:absolute;inset:-5px;border:1px solid rgba(224,179,119,.25);border-radius:999px 999px 22px 22px}
canvas#cv{position:relative;width:100%;height:100%;display:block;border-radius:999px 999px 18px 18px;background:#2a0a18}
#pct{margin-top:34px;font-size:13.5px;font-weight:300;color:var(--soft);height:1.4em;letter-spacing:.04em}
.name{margin-top:10px;font:italic 500 clamp(44px,13vw,60px)/1.02 var(--serif);letter-spacing:.005em}
.name span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity 1s,transform 1s,filter 1s}
.name.on span{opacity:1;transform:none;filter:none}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px auto 0;width:200px;color:var(--gold);opacity:0;transition:opacity 1.2s .9s}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule.on{opacity:1}
.card{max-width:480px;margin:34px auto 0;padding:34px 26px 30px;border:1px solid rgba(224,179,119,.28);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateY(16px);transition:opacity 1s,transform 1s}
.card.on{opacity:1;transform:none}
.lt{font-size:17px;font-weight:300;line-height:2.05;color:var(--ivory);min-height:13.5em;text-align:center}
.lt em{font:italic 500 22px var(--serif);color:var(--gold);display:block;margin-bottom:8px}
.sig{margin-top:18px;font:italic 500 24px var(--serif);color:var(--gold);opacity:0;transition:opacity 1.2s}
.sig.on{opacity:1}
.caret{display:inline-block;width:1.5px;height:1em;background:var(--gold);vertical-align:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
#again{margin-top:30px;background:none;border:1px solid rgba(224,179,119,.5);color:var(--gold);padding:10px 24px;border-radius:999px;font:400 14px var(--sans);cursor:pointer;display:none;transition:background .3s}
#again:hover{background:rgba(224,179,119,.12)}
#again:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.caret{animation:none}.frame{transition:none}}

.sec{margin-top:120px}
.sec h2{font:500 clamp(28px,6vw,40px)/1.4 var(--sans);letter-spacing:.01em}
.sec .en{font:italic 500 22px var(--serif);color:var(--gold);margin-top:4px}
.rv{opacity:0;transform:translateY(34px);transition:opacity 1.1s,transform 1.1s}
.rv.on{opacity:1;transform:none}
.gal{display:flex;flex-wrap:wrap;justify-content:center;gap:44px 34px;margin-top:52px}
.pol{width:min(300px,84vw);background:#f6ece3;padding:12px 12px 20px;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.5);transform:rotate(var(--r,-3deg)) translateY(34px)}
.pol.on{transform:rotate(var(--r,-3deg))}
.pol:nth-child(2){--r:2.5deg;margin-top:40px}.pol:nth-child(3){--r:-1.5deg}
.pol img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;filter:blur(16px) saturate(.3);transition:filter 2.2s;border-radius:2px}
.pol.on img{filter:none}
.pol p{color:#4a1a2a;font-size:15.5px;line-height:1.7;padding:16px 8px 2px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:48px;text-align:center}
.fl{perspective:800px;background:none;border:0;padding:0;margin:0;height:170px;cursor:pointer;color:inherit;font:inherit}
.fl i{position:relative;display:block;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.fl.f i{transform:rotateY(180deg)}
.fl b,.fl em{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:18px;border:1px solid rgba(224,179,119,.3);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-style:normal}
.fl b{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));font:500 21px var(--sans)}
.fl b span{font-size:26px;color:var(--rose)}
.fl em{background:linear-gradient(160deg,#4a1128,#2a0a18);transform:rotateY(180deg);font-size:16.5px;font-weight:300;line-height:1.85}
.fl:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:18px}
.hint{margin-top:18px;font-size:13.5px;color:var(--soft);font-weight:300}
.ask{position:relative;margin-top:130px;padding:80px 20px;border-radius:28px;overflow:hidden;border:1px solid rgba(224,179,119,.3)}
.ask::before{content:"";position:absolute;inset:0;background:var(--bgimg) center 20%/cover;opacity:.28;filter:blur(2px)}
.ask::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(18,4,10,.2),rgba(18,4,10,.85))}
.ask>*{position:relative;z-index:1}
.ask h2{font:500 clamp(26px,6vw,38px)/1.55 var(--sans)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:34px;min-height:56px}
.btns button,.yes{font:500 16px var(--sans);padding:13px 30px;border-radius:999px;cursor:pointer;margin:0}
.yes{background:linear-gradient(135deg,var(--rose),#b32a50);border:0;color:#fff;box-shadow:0 10px 30px rgba(224,82,111,.45)}
.no{background:none;border:1px solid var(--soft);color:var(--soft);transition:transform .35s}
.ans{margin-top:30px;font:italic 500 28px/1.5 var(--serif);color:var(--gold);min-height:1.5em;opacity:0;transition:opacity 1.2s}
.ans.on{opacity:1}
.foot{margin-top:70px;font-size:13px;color:var(--soft);font-weight:300}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<section class="screen" id="boot">
  <div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="56"/><circle class="p" id="arc" cx="60" cy="60" r="56"/></svg><b id="num">0</b></div>
  <p id="cap">কিছু একটা তৈরি হচ্ছে…</p>
</section>
<main class="screen" id="main">
  <div class="stagewrap"><div class="frame" id="fr"><canvas id="cv" width="720" height="960" role="img" aria-label="Jannatul Prity Mim"></canvas></div></div>
  <p id="pct"></p>
  <h1 class="name" id="nm"></h1>
  <div class="rule" id="rl">♥</div>
  <div class="card" id="cd"><p class="lt" id="lt"></p><p class="sig" id="sg">— শুধু তোমার</p></div>
  <section class="sec" id="s1"><div class="rv"><h2>আমাদের ছোট ছোট মুহূর্ত</h2><p class="en">moments I keep close</p></div>
    <div class="gal">
      <figure class="pol rv"><img data-i="1" alt="Prity"><p>নীল ওড়নায় তুমি যেন এক টুকরো আকাশ ☁️</p></figure>
      <figure class="pol rv"><img data-i="2" alt="Prity"><p>সাদামাটা তুমি, তবুও সবচেয়ে সুন্দর 🌸</p></figure>
      <figure class="pol rv"><img data-i="0" alt="Prity"><p>লাল রঙে তোমাকে সবচেয়ে বেশি মানায় ❤️</p></figure>
    </div></section>
  <section class="sec" id="s2"><div class="rv"><h2>কেন তোমাকে এত ভালোবাসি</h2><p class="en">six little reasons</p></div>
    <div class="grid rv" id="gr"></div><p class="hint rv">কার্ডগুলোতে ট্যাপ করো 💌</p></section>
  <section class="ask rv" id="s3"><h2>মিম, একটা কথা জিজ্ঞেস করি…<br>তুমি কি সারাজীবন আমার পাশে থাকবে?</h2>
    <div class="btns"><button class="yes" id="yes">হ্যাঁ, থাকবো 💖</button><button class="no" id="no">না</button></div>
    <p class="ans" id="ans"></p></section>
  <p class="foot rv">তোমার জন্য, ভালোবাসা দিয়ে বানানো ♥</p>
  <button id="again">আবার দেখো</button>
</main>

/* ambient particles */
var fx=$('fx'),fc=fx.getContext('2d'),P=[],W,H,dpr=Math.min(2,devicePixelRatio||1);
function size(){W=innerWidth;H=innerHeight;fx.width=W*dpr;fx.height=H*dpr;fc.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
function mk(init){var heart=Math.random()<.22;return{x:Math.random()*W,y:init?Math.random()*H:H+20,r:heart?5+Math.random()*7:.8+Math.random()*1.8,v:.15+Math.random()*.45,s:Math.random()*6,h:heart,a:.15+Math.random()*.45,c:Math.random()<.5?'224,179,119':'224,82,111'}}
for(var i=0;i<46;i++)P.push(mk(true));
function hp(c,x,y,r){c.beginPath();c.moveTo(x,y+r*.35);c.bezierCurveTo(x-r,y-r*.5,x-r*.4,y-r*1.1,x,y-r*.45);c.bezierCurveTo(x+r*.4,y-r*1.1,x+r,y-r*.5,x,y+r*.35+r*.9);c.fill()}
function loop(){
  fc.clearRect(0,0,W,H);
  P.forEach(function(p,i){
    p.y-=p.v;p.s+=.01;p.x+=Math.sin(p.s)*.25;
    if(p.y<-20)P[i]=mk(false);
    fc.fillStyle='rgba('+p.c+','+p.a+')';
    if(p.h)hp(fc,p.x,p.y,p.r);else{fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.283);fc.fill()}
  });
  requestAnimationFrame(loop);
}
if(!reduce)loop();
/* photo */
var img=new Image(),ready=false;img.onload=function(){ready=true};img.src=SRC;
var cv=$('cv'),cx=cv.getContext('2d'),off=document.createElement('canvas'),ox=off.getContext('2d');
function draw(p){
  if(!ready)return;
  var w0=cv.width,h0=cv.height,s=Math.max(1,Math.round(56*Math.pow(1-p,2.4)));
  var w=Math.max(2,Math.ceil(w0/s)),h=Math.max(2,Math.ceil(h0/s));
  off.width=w;off.height=h;ox.drawImage(img,0,0,w,h);
  cx.imageSmoothingEnabled=s<=1;cx.clearRect(0,0,w0,h0);cx.drawImage(off,0,0,w,h,0,0,w0,h0);
  if(p<1){var y=h0*p,g=cx.createLinearGradient(0,y-40,0,y);g.addColorStop(0,'rgba(224,179,119,0)');g.addColorStop(1,'rgba(224,179,119,.45)');cx.fillStyle=g;cx.fillRect(0,y-40,w0,40);cx.fillStyle='rgba(246,233,223,.9)';cx.fillRect(0,y-1,w0,2)}
}
/* tilt */
var fr=$('fr');
if(!reduce)addEventListener('pointermove',function(e){var x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);fr.style.transform='rotateY('+x*10+'deg) rotateX('+(-y*8)+'deg)'});
/* sequence */
function nameIn(){
  var n=$('nm');n.innerHTML='';
  ['Jannatul','Prity Mim'].forEach(function(line,li){
    var d=document.createElement('div');
    line.split('').forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;s.style.transitionDelay=((li*8+i)*60)+'ms';d.appendChild(s)});
    n.appendChild(d);
  });
  void n.offsetWidth;n.classList.add('on');
}
function typeLetter(done){
  var el=$('lt'),full=BODY,i=0;
  var head='<em>'+HEAD+'</em>';
  if(reduce){el.innerHTML=head+full.replace(/\n/g,'<br>');return done()}
  (function step(){
    el.innerHTML=head+full.slice(0,i).replace(/\n/g,'<br>')+'<span class="caret"></span>';
    if(i++<full.length){var c=full[i-2];later(step,c==='\n'?380:(c==='।'||c===',')?220:42)}
    else{el.innerHTML=head+full.replace(/\n/g,'<br>');done()}
  })();
}
function build(){
  var t0=null,dur=reduce?10:6800;
  (function f(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur);draw(p);
    $('pct').textContent=p<1?'তৈরি হচ্ছে… '+Math.round(p*100)+'%':'তৈরি হয়ে গেল';
    if(p<1)return requestAnimationFrame(f);
    nameIn();$('rl').classList.add('on');
    later(function(){$('cd').classList.add('on');later(function(){typeLetter(function(){$('sg').classList.add('on');$('again').style.display='inline-block'})},900)},1500);
  })(performance.now());
}
function boot(){
  timers.forEach(clearTimeout);timers=[];
  $('main').style.display='none';$('boot').style.display='flex';
  ['nm','rl','cd','sg'].forEach(function(i){$(i).classList.remove('on')});
  $('lt').innerHTML='';$('again').style.display='none';
  var arc=$('arc'),num=$('num'),cap=$('cap'),T=reduce?300:4200,s=performance.now(),ci=-1;
  (function f(){
    var p=Math.min(1,(performance.now()-s)/T),e=1-Math.pow(1-p,2);
    arc.style.strokeDashoffset=352*(1-e);num.textContent=Math.round(e*100);
    var k=Math.min(CAPS.length-1,Math.floor(p*CAPS.length));
    if(k!==ci){ci=k;cap.style.opacity=0;later(function(){cap.textContent=CAPS[k];cap.style.opacity=1},reduce?0:250)}
    if(p<1)requestAnimationFrame(f);
    else later(function(){$('boot').style.display='none';$('main').style.display='block';scrollTo(0,0);build()},400);
  })();
}

var R=[["তোমার হাসি","ওই হাসিটা দেখলেই আমার সব দুশ্চিন্তা হারিয়ে যায়।"],["তোমার চোখ","ওই চোখে তাকালে মনে হয় সময়টা থেমে গেছে।"],["তোমার যত্ন","না বললেও তুমি আমার মনের কথা বুঝে ফেলো।"],["তোমার পাশে থাকা","তুমি থাকলে যেকোনো দিনই সুন্দর হয়ে যায়।"],["তোমার সরলতা","তুমি যেমন আছো, ঠিক তেমনটাই আমার সবচেয়ে প্রিয়।"],["শুধু তুমি","আর কোনো কারণ লাগে না, তুমি তুমি বলেই।"]];
var gr=$('gr');
R.forEach(function(r){var b=document.createElement('button');b.className='fl';b.innerHTML='<i><b><span>♥</span>'+r[0]+'</b><em>'+r[1]+'</em></i>';b.onclick=function(){b.classList.toggle('f')};gr.appendChild(b)});
document.querySelectorAll('img[data-i]').forEach(function(m){m.src=IMGS[m.dataset.i]});
document.querySelector('.ask').style.setProperty('--bgimg','url('+IMGS[2]+')');
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('on')})},{threshold:.18});
document.querySelectorAll('.rv').forEach(function(e){io.observe(e)});
var no=$('no');
function dodge(){var x=(Math.random()-.5)*240,y=(Math.random()-.5)*120;no.style.transform='translate('+x+'px,'+y+'px)'}
no.addEventListener('pointerenter',dodge);no.addEventListener('pointerdown',function(e){e.preventDefault();dodge()});
$('yes').onclick=function(){
  var a=$('ans');a.textContent='জানতাম! আমিও তোমাকে অনেক অনেক ভালোবাসি, মিম ❤';a.classList.add('on');
  var r=this.getBoundingClientRect(),cx0=r.left+r.width/2,cy0=r.top+r.height/2;
  for(var i=0;i<42;i++){
    var h=document.createElement('div');h.textContent=['❤','💖','💕','✨'][i%4];
    h.style.cssText='position:fixed;z-index:50;pointer-events:none;font-size:'+(16+Math.random()*22)+'px;left:'+cx0+'px;top:'+cy0+'px';
    document.body.appendChild(h);
    var ang=Math.random()*6.283,d=120+Math.random()*320;
    var an=h.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:'translate('+Math.cos(ang)*d+'px,'+(Math.sin(ang)*d-120)+'px) scale(1.2)',opacity:0}],{duration:1600+Math.random()*1200,easing:'cubic-bezier(.2,.7,.3,1)'});
    an.onfinish=(function(el){return function(){el.remove()}})(h);
  }
};
$('again').onclick=function(){document.querySelectorAll('.rv').forEach(function(e){e.classList.remove('on')});$('ans').classList.remove('on');boot()};boot();
</script>
</body>
